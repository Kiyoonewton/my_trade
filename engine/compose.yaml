services:
  app:
    build:
      context: ..
      dockerfile: engine/Dockerfile
      target: application
    env_file: .env
    volumes:
      - ../exports:/exports
      - ../raw:/raw
      - collection_state:/state
    depends_on:
      mongodb:
        condition: service_healthy
  collector:
    build:
      context: ..
      dockerfile: engine/Dockerfile
      target: collector
    env_file: .env
    shm_size: 1gb
    volumes:
      - ../exports:/exports
      - ../raw:/raw
      - collection_state:/state
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  mongo_data:
  collection_state:
